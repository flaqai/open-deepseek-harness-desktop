<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
    <link rel="icon" href="icon.png">
    <title>选择数据目录</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        color: #171719;
        background: #fff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; overflow: hidden; background: #fff; }
      button { font: inherit; }
      .shell {
        display: grid;
        grid-template-rows: minmax(82px, auto) minmax(0, 1fr) 82px;
        height: 100vh;
        min-height: 0;
        overflow: hidden;
      }
      .titlebar {
        align-items: center;
        border-bottom: 1px solid #e6e7ea;
        display: flex;
        gap: 24px;
        justify-content: flex-start;
        padding: 12px 28px 12px 38px;
        position: relative;
      }
      .header-actions {
        align-items: center;
        display: flex;
        flex: 1 1 auto;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
        min-width: 0;
      }
      .language-picker {
        align-items: center;
        display: flex;
        flex: 0 0 auto;
        position: relative;
      }
      .development-tools {
        align-items: center;
        display: flex;
        flex: 0 1 auto;
      }
      .development-tools[hidden] { display: none; }
      .development-toggle {
        appearance: none;
        background: #eef4ff;
        border: 1px solid #c7d7f8;
        border-radius: 999px;
        color: #315aab;
        cursor: pointer;
        font-size: 12px;
        font-weight: 620;
        max-width: min(320px, 100%);
        padding: 8px 12px;
        white-space: normal;
        transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }
      .development-toggle:hover { background: #e3edff; border-color: #a9c1f2; }
      .development-toggle:focus-visible { outline: 2px solid #4176e6; outline-offset: 2px; }
      .development-toggle[aria-pressed="true"] {
        background: #315aab;
        border-color: #315aab;
        box-shadow: 0 0 0 3px rgb(49 90 171 / 12%);
        color: #fff;
      }
      .language-trigger {
        align-items: center;
        appearance: none;
        background: linear-gradient(180deg, #fff, #f8f9fb);
        border: 1px solid #d9dce2;
        border-radius: 11px;
        box-shadow: 0 2px 8px rgb(20 25 36 / 5%);
        color: #171719;
        cursor: pointer;
        display: flex;
        font-size: 13px;
        font-weight: 590;
        gap: 10px;
        justify-content: space-between;
        min-width: 158px;
        max-width: min(240px, calc(100vw - 40px));
        padding: 9px 12px;
        transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }
      .language-inline-label { color: #858a94; font-size: 12px; font-weight: 560; }
      .language-divider { background: #e1e3e8; height: 16px; width: 1px; }
      #language-current { flex: 1; min-width: 0; text-align: left; white-space: nowrap; }
      .language-trigger:hover { background: #fff; border-color: #bfc4cd; box-shadow: 0 4px 12px rgb(20 25 36 / 8%); }
      .language-trigger[aria-expanded="true"] { border-color: #a9bde9; box-shadow: 0 0 0 3px rgb(65 118 230 / 10%); }
      .language-chevron {
        border-bottom: 1px solid #62666f;
        border-right: 1px solid #62666f;
        height: 6px;
        transform: rotate(45deg) translate(-1px, -1px);
        transition: transform 160ms ease;
        width: 6px;
      }
      .language-trigger[aria-expanded="true"] .language-chevron { transform: rotate(225deg) translate(-1px, -1px); }
      .language-trigger:focus-visible { outline: 2px solid #4176e6; outline-offset: 2px; }
      .language-menu {
        background: rgb(255 255 255 / 96%);
        border: 1px solid #e1e3e8;
        border-radius: 13px;
        box-shadow: 0 16px 38px rgb(18 23 33 / 16%);
        display: grid;
        gap: 4px;
        padding: 6px;
        position: absolute;
        right: 0;
        top: calc(100% + 9px);
        max-width: calc(100vw - 40px);
        min-width: 100%;
        width: max-content;
        z-index: 12;
      }
      .language-menu[hidden] { display: none; }
      .language-option {
        align-items: center;
        appearance: none;
        background: transparent;
        border: 0;
        border-radius: 9px;
        color: #25272c;
        cursor: pointer;
        display: flex;
        font-weight: 580;
        justify-content: space-between;
        padding: 10px 11px;
        text-align: left;
        width: 100%;
      }
      .language-option:hover { background: #f4f6fa; }
      .language-option[aria-selected="true"] { background: #eef4ff; color: #2f68d6; }
      .language-option:focus-visible { outline: 2px solid #4176e6; outline-offset: -2px; }
      .language-code { color: #9297a1; font-size: 11px; font-weight: 650; letter-spacing: .08em; }
      .language-option[aria-selected="true"] .language-code { color: #6d91dd; }
      .brand { align-items: center; display: flex; flex: 0 0 auto; gap: 13px; }
      .brand img { border-radius: 11px; box-shadow: 0 6px 16px rgb(20 53 118 / 18%); height: 40px; width: 40px; }
      .brand-copy { display: grid; gap: 2px; }
      .brand-copy strong { font-size: 18px; font-weight: 720; letter-spacing: -.028em; line-height: 1.12; }
      .brand-copy small { color: #747983; font-size: 12px; font-weight: 550; letter-spacing: .01em; line-height: 1.2; }
      .content { display: grid; grid-template-columns: minmax(390px, 44%) 1fr; min-height: 0; }
      .choices-pane { border-right: 1px solid #e6e7ea; min-height: 0; overflow: auto; padding: 30px 38px 34px; }
      .choice-title { flex-wrap: wrap; overflow-wrap: anywhere; }
      .target-choice { font: inherit; color: inherit; text-align: left; }
      .source-panel {
        background: #f8f9fb;
        border: 1px solid #e1e3e8;
        border-radius: 13px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin: 0 0 14px;
        overflow: hidden;
      }
      .source-entry { min-width: 0; padding: 13px; }
      .source-entry + .source-entry { border-left: 1px solid #e1e3e8; }
      .source-heading { align-items: flex-start; display: flex; gap: 8px; }
      .source-dot { background: #9ca1ab; border-radius: 50%; box-shadow: 0 0 0 4px rgb(156 161 171 / 12%); height: 8px; width: 8px; }
      .source-entry[data-status="valid"] .source-dot { background: #299469; box-shadow: 0 0 0 4px rgb(41 148 105 / 12%); }
      .source-entry[data-status="unreadable"] .source-dot { background: #c88614; box-shadow: 0 0 0 4px rgb(200 134 20 / 13%); }
      .source-heading strong { font-size: 12px; font-weight: 650; line-height: 1.35; }
      .source-path { color: #5f646e; display: block; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; line-height: 1.4; margin: 8px 0 0; overflow-wrap: anywhere; }
      .source-summary { color: #747983; font-size: 11px; line-height: 1.4; margin: 6px 0 0; }
      .source-error { color: #bc433d; font-size: 11px; line-height: 1.4; margin: 7px 0 0; }
      .source-error[hidden], .source-path[hidden], .source-summary[hidden] { display: none; }
      .source-actions { display: flex; margin: 10px 0 0; }
      .source-action { appearance: none; background: #fff; border: 1px solid #cfd3da; border-radius: 8px; color: #2e64ca; cursor: pointer; font-size: 11px; font-weight: 590; padding: 7px 9px; width: 100%; }
      .source-action:hover { background: #f2f5fb; border-color: #b7c6e4; }
      .source-action:focus-visible { outline: 2px solid #4176e6; outline-offset: 2px; }
      .source-action[hidden] { display: none; }
      .choices { padding-top: 2px; }
      .choice {
        appearance: none;
        background: transparent;
        border: 1px solid transparent;
        border-bottom: 1px solid #e6e7ea;
        border-radius: 12px;
        color: inherit;
        cursor: pointer;
        display: grid;
        gap: 0 16px;
        grid-template-columns: 28px 1fr;
        padding: 24px 14px;
        text-align: left;
        transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        width: 100%;
      }
      .choice[data-source="official"] {
        --mode-accent: #4176e6;
        --mode-border: #b8ccfb;
        --mode-hover: #f7f9ff;
        --mode-shadow: rgb(65 118 230 / 7%);
        --mode-surface-start: #eaf2ff;
        --mode-surface-end: #f8fbff;
      }
      .choice[data-source="community"] {
        --mode-accent: #c88614;
        --mode-border: #edce91;
        --mode-hover: #fffbf3;
        --mode-shadow: rgb(200 134 20 / 7%);
        --mode-surface-start: #fff5dd;
        --mode-surface-end: #fffaf1;
      }
      .choice[data-source="fresh"] {
        --mode-accent: #2d9565;
        --mode-border: #a9d9c2;
        --mode-hover: #f5fbf8;
        --mode-shadow: rgb(45 149 101 / 7%);
        --mode-surface-start: #eaf8f1;
        --mode-surface-end: #f7fcf9;
      }
      .choice:last-child { border-bottom-color: transparent; }
      .choice:hover { background: var(--mode-hover); }
      .choice:focus-visible { outline: 2px solid var(--mode-accent); outline-offset: 2px; }
      .choice[aria-checked="true"] {
        background: linear-gradient(135deg, var(--mode-surface-start), var(--mode-surface-end));
        border-color: var(--mode-border);
        box-shadow: 0 7px 20px var(--mode-shadow);
      }
      .radio {
        border: 1.5px solid #a7abb3;
        border-radius: 50%;
        height: 22px;
        margin-top: 2px;
        position: relative;
        width: 22px;
      }
      .choice[aria-checked="true"] .radio { border: 6px solid var(--mode-accent); }
      .choice-title { align-items: center; display: flex; gap: 10px; font-size: 16px; font-weight: 620; line-height: 1.4; }
      .recommended { background: #e9f0ff; border-radius: 999px; color: #316bd8; font-size: 12px; font-weight: 600; padding: 3px 8px; }
      .choice-description { color: #696d76; font-size: 13px; line-height: 1.6; margin-top: 6px; }
      .choice-requirement { color: #a66d0c; display: block; font-size: 12px; font-weight: 580; line-height: 1.45; margin-top: 5px; }
      .choice-requirement[hidden] { display: none; }
      .detail {
        --detail-accent: #376fdc;
        --detail-dot: rgb(65 118 230 / 20%);
        --detail-surface: rgb(236 244 255 / 84%);
        background: linear-gradient(135deg, var(--detail-surface), transparent 58%);
        min-width: 0;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 46px 52px 36px;
        position: relative;
        transition: background 180ms ease;
      }
      .detail[data-source="official"] { --detail-accent: #376fdc; --detail-dot: rgb(65 118 230 / 20%); --detail-surface: rgb(236 244 255 / 84%); }
      .detail[data-source="community"] { --detail-accent: #ad700a; --detail-dot: rgb(200 134 20 / 20%); --detail-surface: rgb(255 247 228 / 86%); }
      .detail[data-source="fresh"] { --detail-accent: #237d54; --detail-dot: rgb(45 149 101 / 20%); --detail-surface: rgb(235 249 242 / 86%); }
      .detail::before {
        background-image: radial-gradient(circle, var(--detail-dot) 1px, transparent 1.5px);
        background-size: 11px 11px;
        content: '';
        height: 190px;
        pointer-events: none;
        position: absolute;
        right: -16px;
        top: -18px;
        width: 260px;
        -webkit-mask-image: linear-gradient(135deg, #000 8%, transparent 76%);
        mask-image: linear-gradient(135deg, #000 8%, transparent 76%);
      }
      .detail > * { position: relative; z-index: 1; }
      .detail-heading { align-items: center; display: flex; gap: 12px; margin-bottom: 22px; }
      .detail-heading h1 { color: var(--detail-accent); font-size: 19px; letter-spacing: -.018em; line-height: 1.35; margin: 0; transition: color 180ms ease; }
      .help-button {
        align-items: center;
        appearance: none;
        background: rgb(255 255 255 / 72%);
        border: 0;
        border-radius: 50%;
        color: #62666f;
        cursor: pointer;
        display: inline-flex;
        height: 30px;
        justify-content: center;
        width: 30px;
      }
      .help-button img { height: 17px; width: 17px; }
      .help-button:hover { background: #f3f5f8; color: #171719; }
      .help-button:focus-visible { outline: 2px solid var(--detail-accent); outline-offset: 2px; }
      .risk { background: #fff8e9; border: 1px solid #edce91; border-radius: 10px; color: #9a6207; font-size: 13px; line-height: 1.5; margin: 0 0 20px; max-width: 640px; padding: 11px 14px; }
      .risk[hidden] { display: none; }
      .detail-stage {
        display: grid;
        grid-template-areas: "stage";
        min-height: 330px;
        position: relative;
      }
      .facts {
        grid-area: stage;
        margin: 0;
        opacity: 1;
        pointer-events: auto;
        transform: translateX(0);
        transition: opacity 180ms ease, transform 260ms cubic-bezier(.22, .8, .24, 1), visibility 0s linear 0s;
        visibility: visible;
      }
      .detail-stage:not([data-step="details"]) .facts {
        opacity: 0;
        pointer-events: none;
        transform: translateX(-18px);
        transition: opacity 160ms ease, transform 220ms ease, visibility 0s linear 220ms;
        visibility: hidden;
      }
      .fact { border-bottom: 1px solid #e6e7ea; padding: 18px 0; }
      .fact:last-child { border-bottom: 0; }
      .fact dt { font-size: 14px; font-weight: 620; margin-bottom: 6px; }
      .fact dd { color: #696d76; font-size: 13px; line-height: 1.55; margin: 0; }
      .destination-panel, .operation-panel, .portable-panel {
        grid-area: stage;
        margin: 0;
        max-width: 680px;
        opacity: 0;
        pointer-events: none;
        transform: translateX(18px);
        transition: opacity 160ms ease, transform 220ms ease, visibility 0s linear 220ms;
        visibility: hidden;
      }
      .detail-stage[data-step="operation"] .operation-panel,
      .detail-stage[data-step="plugins"] .portable-panel,
      .detail-stage[data-step="destination"] .destination-panel {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(0);
        transition: opacity 200ms ease 70ms, transform 280ms cubic-bezier(.22, .8, .24, 1) 50ms, visibility 0s linear 0s;
        visibility: visible;
      }
      .destination-panel h2, .operation-panel h2, .portable-panel h2 { color: var(--detail-accent); font-size: 16px; margin: 0 0 8px; }
      .destination-summary { color: #696d76; line-height: 1.55; margin: 0 0 18px; }
      .target-choices { display: grid; gap: 12px; }
      .target-choice {
        align-items: flex-start;
        appearance: none;
        background: rgb(255 255 255 / 72%);
        border: 1px solid #dfe2e8;
        border-radius: 14px;
        color: inherit;
        cursor: pointer;
        display: grid;
        gap: 0 14px;
        grid-template-columns: 22px 1fr;
        padding: 17px 18px;
        text-align: left;
        transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
        width: 100%;
      }
      .target-choice:hover { background: #fff; border-color: #c8cfdb; transform: translateY(-1px); }
      .target-choice:focus-visible { outline: 2px solid var(--detail-accent); outline-offset: 2px; }
      .target-choice[aria-checked="true"] {
        background: rgb(255 255 255 / 92%);
        border-color: var(--detail-accent);
        box-shadow: 0 8px 24px rgb(30 55 105 / 8%), 0 0 0 3px color-mix(in srgb, var(--detail-accent) 10%, transparent);
      }
      .target-radio { border: 1.5px solid #a7abb3; border-radius: 50%; height: 20px; margin-top: 2px; width: 20px; }
      .target-choice[aria-checked="true"] .target-radio { border: 5px solid var(--detail-accent); }
      .target-copy { display: grid; gap: 5px; min-width: 0; }
      .target-copy strong { font-size: 14px; font-weight: 650; }
      .target-copy span { color: #696d76; font-size: 13px; line-height: 1.5; }
      .target-path { color: #555b66; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
      .target-path[hidden] { display: none; }
      .target-action {
        appearance: none;
        background: #fff;
        border: 1px solid #cfd3da;
        border-radius: 8px;
        color: var(--detail-accent);
        cursor: pointer;
        font-size: 12px;
        font-weight: 610;
        justify-self: start;
        margin-top: 5px;
        padding: 7px 10px;
      }
      .target-action:hover { background: #f5f7fa; border-color: #b8bec8; }
      .target-error { color: #bc433d; font-size: 12px; line-height: 1.45; margin: 11px 0 0 36px; }
      .target-error[hidden] { display: none; }
      .footer { align-items: center; border-top: 1px solid #e6e7ea; display: flex; gap: 20px; justify-content: space-between; min-height: 82px; padding: 0 52px; }
      .footer-links { align-items: center; display: flex; flex-wrap: wrap; gap: 20px; min-width: 0; }
      .compare-link { appearance: none; background: transparent; border: 0; color: #286be8; cursor: pointer; padding: 8px 0; }
      .compare-link:hover { text-decoration: underline; }
      .return-link { align-items: center; appearance: none; background: transparent; border: 0; color: #171719; cursor: pointer; display: inline-flex; font-weight: 620; gap: 7px; padding: 8px 0; }
      .return-link::before { content: '←'; font-size: 16px; font-weight: 450; }
      .return-link:hover { color: #286be8; }
      .return-link[hidden], .target-choice[hidden] { display: none; }
      .actions { display: flex; gap: 12px; }
      .action { appearance: none; border-radius: 8px; cursor: pointer; min-width: 104px; padding: 10px 20px; }
      .action[hidden] { display: none; }
      .action.secondary { background: #fff; border: 1px solid #c8cbd1; color: #171719; }
      .action.primary { background: #171719; border: 1px solid #171719; color: #fff; min-width: 154px; }
      .action:disabled { cursor: not-allowed; filter: none; opacity: .45; }
      .action:hover { filter: brightness(.96); }
      .action:focus-visible, .compare-link:focus-visible, .return-link:focus-visible { outline: 2px solid #4176e6; outline-offset: 2px; }
      .overlay { align-items: center; background: rgb(15 18 24 / 42%); display: flex; inset: 0; justify-content: center; padding: 34px; position: fixed; z-index: 10; }
      .overlay[hidden] { display: none; }
      .comparison { background: #fff; border-radius: 14px; box-shadow: 0 20px 60px rgb(15 18 24 / 22%); max-width: 920px; padding: 28px; width: 100%; }
      .comparison-header { align-items: center; display: flex; justify-content: space-between; margin-bottom: 22px; }
      .comparison-header h2 { font-size: 18px; margin: 0; }
      .close { appearance: none; background: transparent; border: 0; color: #555a63; cursor: pointer; line-height: 1; padding: 7px; }
      .close img { height: 16px; width: 16px; }
      .comparison-table-wrap { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 8px 24px rgb(18 24 40 / 5%); overflow: hidden; }
      table { border-collapse: collapse; font-size: 13px; line-height: 1.5; table-layout: fixed; width: 100%; }
      th, td { border-bottom: 1px solid #eceef1; padding: 13px 14px; text-align: left; vertical-align: top; }
      tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
      th:first-child, td:first-child { width: 112px; }
      tbody th { background: #f7f8fa; color: #4f5560; font-weight: 620; }
      thead th { background: #fafbfc; font-weight: 650; text-align: center; }
      thead th[data-mode]::before { border-radius: 50%; content: ''; display: inline-block; height: 7px; margin-right: 7px; vertical-align: 1px; width: 7px; }
      thead th[data-source="official"] { background: #f1f6ff; color: #315fae; }
      thead th[data-source="official"]::before { background: #4f7fe5; }
      thead th[data-source="community"] { background: #fff9ec; color: #93600b; }
      thead th[data-source="community"]::before { background: #d99a2b; }
      thead th[data-source="fresh"] { background: #f0faf5; color: #267552; }
      thead th[data-source="fresh"]::before { background: #3ca477; }
      thead th[data-option="copy"], thead th[data-option="default"] { background: #f1f6ff; color: #315fae; }
      thead th[data-option="copy"]::before, thead th[data-option="default"]::before { background: #4f7fe5; }
      thead th[data-option="reuse"] { background: #fff9ec; color: #93600b; }
      thead th[data-option="reuse"]::before { background: #d99a2b; }
      thead th[data-option="custom"] { background: #f0faf5; color: #267552; }
      thead th[data-option="custom"]::before { background: #3ca477; }
      .comparison-note { background: linear-gradient(135deg, #f6f7f9, #fafbfc); border: 1px solid #eceef1; border-radius: 12px; color: #62666f; font-size: 13px; line-height: 1.55; margin: 18px 0 0; padding: 12px 14px; }
      .comparison-footer { display: flex; justify-content: flex-end; margin-top: 20px; }
      @media (prefers-color-scheme: dark) {
        :root { background: #191a1e; color: #f4f4f5; }
        body { background: #191a1e; }
        .titlebar, .choice, .fact, .footer { border-color: #34363d; }
        .choices-pane { border-color: #34363d; }
        .source-panel, .source-entry + .source-entry { border-color: #3f424a; }
        .source-panel { background: #24262b; }
        .source-path, .source-summary { color: #a8abb3; }
        .source-error { color: #f08a82; }
        .source-action { background: #292b31; border-color: #494c55; color: #a8c4f7; }
        .source-action:hover { background: #30333a; border-color: #626670; }
        .brand-copy small, .language-inline-label, .choice-description, .fact dd, .comparison-note { color: #a8abb3; }
        .destination-summary, .target-copy span { color: #a8abb3; }
        .target-choice { background: rgb(36 38 43 / 78%); border-color: #40434b; }
        .target-choice:hover, .target-choice[aria-checked="true"] { background: #292c32; border-color: var(--detail-accent); }
        .target-radio { border-color: #747986; }
        .target-path { color: #b7bac3; }
        .target-action { background: #292b31; border-color: #494c55; }
        .target-action:hover { background: #30333a; border-color: #626670; }
        .target-error { color: #f08a82; }
        .language-trigger, .help-button, .action.secondary { background: linear-gradient(180deg, #292b31, #24262b); border-color: #494c55; color: #f4f4f5; }
        .return-link { color: #f4f4f5; }
        .language-trigger:hover { background: #2d2f35; border-color: #626670; }
        .language-trigger[aria-expanded="true"] { border-color: #657ba7; box-shadow: 0 0 0 3px rgb(120 163 243 / 10%); }
        .development-toggle { background: #25304a; border-color: #40557c; color: #a8c4f7; }
        .development-toggle:hover { background: #2b3857; border-color: #526b9b; }
        .development-toggle[aria-pressed="true"] { background: #789ee8; border-color: #789ee8; color: #171b25; }
        .language-chevron { border-color: #b8bbc3; }
        .language-divider { background: #494c55; }
        .language-menu { background: rgb(38 40 46 / 98%); border-color: #464951; box-shadow: 0 18px 42px rgb(0 0 0 / 42%); }
        .language-option { color: #f0f1f3; }
        .language-option:hover { background: #30333a; }
        .language-option[aria-selected="true"] { background: #26385d; color: #a8c4f7; }
        .language-code { color: #8d919c; }
        .language-option[aria-selected="true"] .language-code { color: #89a8e4; }
        .choice[data-source="official"] { --mode-accent: #78a3f3; --mode-border: #40557c; --mode-hover: #202735; --mode-shadow: rgb(0 0 0 / 18%); --mode-surface-start: #202b43; --mode-surface-end: #1d2330; }
        .choice[data-source="community"] { --mode-accent: #e0ae55; --mode-border: #66502c; --mode-hover: #2c281f; --mode-shadow: rgb(0 0 0 / 18%); --mode-surface-start: #33291d; --mode-surface-end: #27241f; }
        .choice[data-source="fresh"] { --mode-accent: #70bd96; --mode-border: #355f4b; --mode-hover: #202d28; --mode-shadow: rgb(0 0 0 / 18%); --mode-surface-start: #1d3228; --mode-surface-end: #1d2924; }
        .choice:hover, .help-button:hover { color: #fff; }
        .radio { border-color: #747986; }
        .recommended { background: #26385d; color: #8eb4ff; }
        .detail[data-source="official"] { --detail-accent: #91b5f7; --detail-dot: rgb(120 163 243 / 20%); --detail-surface: rgb(32 43 67 / 66%); }
        .detail[data-source="community"] { --detail-accent: #e0ae55; --detail-dot: rgb(224 174 85 / 18%); --detail-surface: rgb(51 41 29 / 66%); }
        .detail[data-source="fresh"] { --detail-accent: #7bc3a0; --detail-dot: rgb(112 189 150 / 18%); --detail-surface: rgb(29 50 40 / 66%); }
        .risk { background: #33291d; border-color: #725526; color: #f1b65d; }
        .overlay { background: rgb(0 0 0 / 58%); }
        .comparison { background: #222329; box-shadow: 0 20px 60px rgb(0 0 0 / 48%); }
        .close { color: #b7bac1; }
        .close img, .help-button img { filter: invert(1); }
        .comparison-table-wrap { background: #24262b; border-color: #3a3d45; box-shadow: 0 8px 24px rgb(0 0 0 / 18%); }
        th, td { border-color: #373a42; }
        tbody th, thead th { background: #292b31; color: #d6d8dd; }
        thead th[data-source="official"] { background: #273148; color: #a8c4f7; }
        thead th[data-source="community"] { background: #352d21; color: #e6bd76; }
        thead th[data-source="fresh"] { background: #22342c; color: #8bcaab; }
        thead th[data-option="copy"], thead th[data-option="default"] { background: #273148; color: #a8c4f7; }
        thead th[data-option="reuse"] { background: #352d21; color: #e6bd76; }
        thead th[data-option="custom"] { background: #22342c; color: #8bcaab; }
        .comparison-note { background: linear-gradient(135deg, #292b31, #26282e); border-color: #373a42; }
        .action.primary { background: #f4f4f5; border-color: #f4f4f5; color: #191a1e; }
      }
      @media (prefers-reduced-motion: reduce) {
        .choice, .detail, .detail-heading h1, .development-toggle, .language-trigger, .language-chevron, .target-choice, .facts, .destination-panel, .operation-panel, .portable-panel { transition: none; }
      }
      @media (max-width: 860px) {
        .content { grid-template-columns: 1fr; overflow: auto; }
        .choices-pane { border-bottom: 1px solid #e6e7ea; border-right: 0; overflow: visible; padding: 26px; }
        .detail { padding: 30px; }
        .footer { padding: 0 30px; }
      }
      @media (max-width: 720px) {
        .titlebar { align-items: flex-start; flex-direction: column; gap: 10px; padding: 12px 20px; }
        .header-actions { justify-content: flex-start; width: 100%; }
        .footer { align-items: stretch; flex-direction: column; gap: 4px; justify-content: center; padding: 8px 20px; }
        .footer-links, .actions { justify-content: space-between; width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="titlebar">
        <div class="brand"><img src="icon.png" alt=""><span class="brand-copy"><strong>Open DeepSeek Harness Desktop</strong><small data-copy="windowTitle">选择数据目录</small></span></div>
        <div class="header-actions">
          <div id="development-tools" class="development-tools" hidden>
            <button id="simulate-missing-source" class="development-toggle" type="button" aria-pressed="false">开发：模拟未找到配置</button>
          </div>
          <div id="language-picker" class="language-picker">
            <button id="language-trigger" class="language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="language-inline-label" data-copy="languageLabel">语言</span><span class="language-divider" aria-hidden="true"></span><span id="language-current">中文</span><span class="language-chevron" aria-hidden="true"></span></button>
            <div id="language-menu" class="language-menu" role="listbox" aria-label="语言" hidden></div>
          </div>
        </div>
      </header>
      <section class="content">
        <div class="choices-pane">
          <section id="source-panel" class="source-panel" aria-live="polite">
            <div id="official-source" class="source-entry" data-status="missing">
              <div class="source-heading"><span class="source-dot" aria-hidden="true"></span><strong id="official-source-status">官方配置 · 未检测到</strong></div>
              <code id="official-source-path" class="source-path" hidden></code>
              <p id="official-source-summary" class="source-summary">可手动选择其他目录。</p>
              <p id="official-source-error" class="source-error" hidden></p>
              <div class="source-actions">
                <button id="choose-official-source" class="source-action" type="button">选择官方目录</button>
              </div>
            </div>
            <div id="community-source" class="source-entry" data-status="missing">
              <div class="source-heading"><span class="source-dot" aria-hidden="true"></span><strong id="community-source-status">社区配置 · 未检测到</strong></div>
              <code id="community-source-path" class="source-path" hidden></code>
              <p id="community-source-summary" class="source-summary">可手动选择其他目录。</p>
              <p id="community-source-error" class="source-error" hidden></p>
              <div class="source-actions">
                <button id="choose-community-source" class="source-action" type="button">选择社区目录</button>
              </div>
            </div>
          </section>
          <div id="choices" class="choices" role="radiogroup" aria-label="数据目录模式">
            <button class="choice" type="button" role="radio" aria-checked="true" data-source="official">
              <span class="radio" aria-hidden="true"></span>
              <span><span class="choice-title"><span data-copy="importTitle">导入官方 DeepSeek Harness 配置</span></span><span class="choice-description" data-copy="importSummary">将兼容数据复制到独立环境，不与官方目录共享。</span><span class="choice-requirement" data-copy="sourceRequired" hidden>需要先选择已有配置目录。</span></span>
            </button>
            <button class="choice" type="button" role="radio" aria-checked="false" data-source="community">
              <span class="radio" aria-hidden="true"></span>
              <span><span class="choice-title" data-copy="reuseTitle">使用社区桌面版配置</span><span class="choice-description" data-copy="reuseSummary">直接使用或复制 Open DeepSeek Harness Desktop 的已有配置。</span><span class="choice-requirement" data-copy="sourceRequired" hidden>需要先选择已有配置目录。</span></span>
            </button>
            <button class="choice" type="button" role="radio" aria-checked="false" data-source="fresh">
              <span class="radio" aria-hidden="true"></span>
              <span><span class="choice-title" data-copy="freshTitle">全新开始</span><span class="choice-description" data-copy="freshSummary">不导入任何现有数据。</span></span>
            </button>
          </div>
        </div>
        <article id="detail" class="detail" data-source="official">
          <div class="detail-heading"><h1 id="detail-title"></h1><button id="help" class="help-button" type="button" aria-label="查看三个选项的区别"><img src="question-outline-14.svg" alt=""></button></div>
          <p id="risk" class="risk" hidden></p>
          <div id="detail-stage" class="detail-stage" data-step="details">
            <dl id="facts" class="facts">
              <div class="fact"><dt data-copy="locationLabel">数据位置</dt><dd id="location-value"></dd></div>
              <div class="fact"><dt data-copy="sharingLabel">共享范围</dt><dd id="sharing-value"></dd></div>
              <div class="fact"><dt data-copy="pluginsLabel">已有插件</dt><dd id="plugins-value"></dd></div>
              <div class="fact"><dt data-copy="buildsLabel">构建权限</dt><dd id="builds-value"></dd></div>
            </dl>
            <section id="operation-panel" class="operation-panel" aria-hidden="true" inert>
              <h2 data-copy="operationTitle">选择使用方式</h2>
              <p class="destination-summary" data-copy="operationSummary"></p>
              <div class="target-choices" role="radiogroup" aria-labelledby="operation-heading">
                <span id="operation-heading" data-copy="operationTitle" hidden></span>
                <button class="target-choice" type="button" role="radio" aria-checked="true" data-operation="imported">
                  <span class="target-radio" aria-hidden="true"></span>
                  <span class="target-copy"><strong data-operation-copy="importTitle">导入到独立环境</strong><span id="copy-operation-summary"></span></span>
                </button>
                <button class="target-choice" type="button" role="radio" aria-checked="false" data-operation="reused">
                  <span class="target-radio" aria-hidden="true"></span>
                  <span class="target-copy"><strong data-operation-copy="reuseTitle">直接使用此配置</strong><span id="reuse-operation-summary"></span></span>
                </button>
              </div>
              <dl>
                <div class="fact"><dt data-copy="sharingLabel">共享范围</dt><dd id="operation-sharing"></dd></div>
                <div class="fact"><dt data-copy="pluginsLabel">已有插件</dt><dd id="operation-plugins"></dd></div>
                <div class="fact"><dt data-copy="buildsLabel">构建权限</dt><dd id="operation-builds"></dd></div>
              </dl>
            </section>
            <section id="portable-panel" class="portable-panel" aria-hidden="true" inert>
              <h2 id="portable-title">选择插件迁移方式</h2>
              <p id="portable-summary" class="destination-summary"></p>
              <p id="portable-current-host" class="destination-summary"></p>
              <div class="target-choices" role="radiogroup" aria-labelledby="portable-title">
                <button class="target-choice" type="button" role="radio" aria-checked="true" data-migration="online">
                  <span class="target-radio" aria-hidden="true"></span>
                  <span class="target-copy"><strong id="portable-online-title"></strong><span id="portable-online-detail"></span></span>
                </button>
                <button class="target-choice" type="button" role="radio" aria-checked="false" data-migration="offline">
                  <span class="target-radio" aria-hidden="true"></span>
                  <span class="target-copy"><strong id="portable-offline-title"></strong><span id="portable-offline-detail"></span></span>
                </button>
              </div>
              <div id="portable-selection" class="portable-selection" hidden>
                <button id="choose-portable" class="target-action" type="button"></button>
                <p id="portable-target" class="destination-summary"></p>
                <p id="portable-error" class="target-error" role="alert" hidden></p>
              </div>
            </section>
            <section id="destination-panel" class="destination-panel" aria-hidden="true">
              <h2 data-copy="destinationTitle">选择配置目录</h2>
              <p id="destination-summary" class="destination-summary"></p>
              <div id="target-choices" class="target-choices" role="radiogroup" aria-label="配置目录位置">
                <div class="target-choice" role="radio" aria-checked="true" tabindex="0" data-target="default">
                  <span class="target-radio" aria-hidden="true"></span>
                  <span class="target-copy"><strong data-copy="defaultTargetTitle">默认设置</strong><span data-copy="defaultTargetSummary">使用桌面版管理的独立目录，升级和修复时最省心。</span><code id="default-target-path" class="target-path"></code></span>
                </div>
                <div class="target-choice" role="radio" aria-checked="false" tabindex="0" data-target="custom">
                  <span class="target-radio" aria-hidden="true"></span>
                  <span class="target-copy"><strong data-copy="customTargetTitle">自定义配置目录</strong><span data-copy="customTargetSummary">选择一个空文件夹作为此客户端的独立配置目录。</span><code id="custom-target-path" class="target-path" hidden></code><button id="choose-target" class="target-action" type="button" data-copy="chooseTarget">选择空文件夹</button></span>
                </div>
              </div>
              <p id="custom-target-error" class="target-error" hidden></p>
            </section>
          </div>
        </article>
      </section>
      <footer class="footer">
        <div class="footer-links"><button id="return-main" class="return-link" type="button" data-copy="returnMain" hidden>回到主页面</button><button id="compare" class="compare-link" type="button" data-copy="compare">查看完整对比</button></div>
        <div class="actions"><button id="back" class="action secondary" type="button" data-copy="back" hidden>上一步</button><button id="continue" class="action primary" type="button" data-copy="continue">继续</button></div>
      </footer>
    </main>
    <div id="overlay" class="overlay" hidden>
      <section class="comparison" role="dialog" aria-modal="true" aria-labelledby="comparison-title">
        <header class="comparison-header"><h2 id="comparison-title" data-copy="comparisonTitle">这三个选项有什么区别？</h2><button id="close-comparison" class="close" type="button" aria-label="关闭"><img src="close-outline-16.svg" alt=""></button></header>
        <div class="comparison-table-wrap">
          <table>
            <thead id="comparison-head"></thead>
            <tbody id="comparison-body"></tbody>
          </table>
        </div>
        <p class="comparison-note" data-copy="comparisonNote"></p>
        <footer class="comparison-footer"><button id="acknowledge" class="action primary" type="button" data-copy="acknowledge">知道了</button></footer>
      </section>
    </div>
    <script src="data-home-preview.js" defer></script>
  </body>
</html>
