<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <title>DeepSeek Orb</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; }
    .orb {
      width: 70px; height: 70px; padding: 0; border: 1px solid rgba(58, 112, 183, .22); border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, #469dff, #092a6d 62%, #07102c);
      box-shadow: 0 7px 20px rgba(0, 25, 85, .27);
      position: relative; z-index: 1; display: grid; place-items: center; cursor: pointer; -webkit-app-region: no-drag;
    }
    .orb:hover { transform: scale(1.04); }
    .orb:focus-visible { outline: 3px solid #4e8eff; outline-offset: 2px; }
    .orb img { width: 42px; height: 42px; object-fit: contain; }
    body[data-avatar='minimal'] .orb img { display: none; }
    body[data-avatar='minimal'] .orb::after { content: '✦'; color: white; font-size: 36px; line-height: 1; }
    .drag { position: fixed; inset: 0; -webkit-app-region: drag; }
    @media (prefers-reduced-motion: reduce) { .orb:hover { transform: none; } }
  </style>
</head>
<body>
  <div class="drag" aria-hidden="true"></div>
  <button id="orb-expand" class="orb" type="button" aria-label="Open floating chat"><img src="icon.png" alt=""></button>
</body>
</html>
