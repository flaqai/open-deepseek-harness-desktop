appId: ai.flaq.deepseek-harness
productName: Open DeepSeek Harness Desktop
asar: true
npmRebuild: false
directories:
  buildResources: build
  output: ../../.artifacts/desktop-linux
files:
  - lib/**/*
  - package.json
afterPack: scripts/copy-prebuilt-profile.cjs
extraResources:
  - from: bundled-plugins
    to: bundled-plugins
    filter:
      - "**/*"
  - from: ../../.artifacts/desktop-runtime-linux-${arch}
    to: harness
    filter:
      - "**/*"
      - "!node_modules{,/**/*}"
  - from: ../../.artifacts/desktop-runtime-linux-${arch}/node_modules
    to: harness/node_modules
    filter:
      - "**/*"
  - from: ../../.artifacts/desktop-runtime-linux-${arch}/package-runtime/lib/node_modules
    to: harness/package-runtime/lib/node_modules
    filter:
      - "**/*"
linux:
  icon: src/icon.png
  category: Development
  executableName: open-deepseek-harness-desktop
  syncDesktopName: true
  target:
    - deb
    - rpm
  artifactName: DeepSeek-Harness-linux-x64.${ext}
deb:
  packageName: deepseek-harness
rpm:
  packageName: deepseek-harness
