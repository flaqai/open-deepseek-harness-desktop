appId: ai.flaq.deepseek-harness
productName: Open DeepSeek Harness Desktop
asar: true
npmRebuild: false
directories:
  buildResources: build
  output: ../../.artifacts/desktop-windows
files:
  - lib/**/*
  - renderer/**/*
  - scripts/primary-runtime-lock.json
  - package.json
extraResources:
  - from: bundled-plugins
    to: bundled-plugins
    filter:
      - "**/*"
  - from: ../../.artifacts/desktop-runtime-win-x64/harness
    to: harness
    filter:
      - "**/*"
      - "!node_modules{,/**/*}"
  # electron-builder 26 omits a source-root node_modules directory. Copy its
  # contents from one level deeper while preserving the final Harness layout.
  - from: ../../.artifacts/desktop-runtime-win-x64/harness/node_modules
    to: harness/node_modules
    filter:
      - "**/*"
  - from: ../../.artifacts/desktop-runtime-win-x64/runtime
    to: runtime
    filter:
      - "**/*"
  - from: ../../.artifacts/workspace-runtime/DeepSeek-Harness-workspace-runtime-win32-x64.tar.gz
    to: workspace-runtime/DeepSeek-Harness-workspace-runtime-win32-x64.tar.gz
  - from: ../../.artifacts/workspace-runtime/workspace-runtime-win32-x64.json
    to: workspace-runtime/workspace-runtime-win32-x64.json
  - from: build/cli-bin
    to: cli-bin
    filter:
      - "**/*"
  - from: lib/desktop-cli-launcher.js
    to: cli/desktop-cli.mjs
  - from: ../../.artifacts/desktop-prebuilt-win32-x64.tar
    to: prebuilt-profile.tar
  - from: ../../.artifacts/desktop-prebuilt-win32-x64.tar.sha256
    to: prebuilt-profile.tar.sha256
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: DeepSeek-Harness-windows-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  # Ask before any assisted-installer page. Keep the shipped language set
  # intentionally small so every installer string has a reviewed translation.
  displayLanguageSelector: true
  installerLanguages:
    - zh_CN
    - en_US
