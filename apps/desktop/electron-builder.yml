appId: ai.flaq.deepseek-harness
productName: DeepSeek Harness
asar: true
npmRebuild: false
directories:
  buildResources: build
  output: ../../.artifacts/desktop-windows
files:
  - lib/**/*
  - package.json
extraResources:
  - from: bundled-plugins
    to: bundled-plugins
    filter:
      - "**/*"
  - from: ../../.artifacts/desktop-runtime-win-x64/harness
    to: harness
    filter:
      - "**/*"
  - from: ../../.artifacts/desktop-runtime-win-x64/runtime
    to: runtime
    filter:
      - "**/*"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: DeepSeek-Harness-windows-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
