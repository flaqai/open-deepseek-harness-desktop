appId: ai.flaq.deepseek-harness
productName: DeepSeek Harness
asar: true
npmRebuild: false
directories:
  buildResources: build
  output: ../../.artifacts/desktop-windows
files:
  - lib/**/*
  - package.json
extraResources:
  - from: ../../.artifacts/desktop-bundled-plugins
    to: bundled-plugins
    filter:
      - "**/*"
  - from: ../../.artifacts/desktop-runtime-win-x64/harness
    to: harness
    filter:
      - "**/*"
      - "!node_modules{,/**/*}"
  # electron-builder 26 omits a source-root node_modules directory. Copy its
  # contents from one level deeper while preserving the final Harness layout.
  - from: ../../.artifacts/desktop-runtime-win-x64/harness/node_modules
    to: harness/node_modules
    filter:
      - "**/*"
  - from: ../../.artifacts/desktop-runtime-win-x64/runtime
    to: runtime
    filter:
      - "**/*"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: DeepSeek-Harness-windows-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Prefer faster ZIP extraction for the full Node/Harness runtime. The
  # resulting installer can be larger than electron-builder's default 7z/LZMA
  # payload, so Windows CI records both size and install duration.
  useZip: true
