appId: ai.flaq.deepseek-harness
productName: DeepSeek Harness
asar: true
npmRebuild: false
directories:
  buildResources: build
  output: ../../.artifacts/desktop-macos
files:
  - lib/**/*
  - package.json
extraResources:
  - from: bundled-plugins
    to: bundled-plugins
    filter:
      - "**/*"
  - from: ../../.artifacts/desktop-runtime-darwin-${arch}.tar.gz
    to: harness-runtime.tar.gz
  - from: lib/desktop-cli-launcher.js
    to: cli/desktop-cli.mjs
mac:
  extendInfo:
    CFBundleDisplayName: Open DSH Desktop
    NSMicrophoneUsageDescription: DeepSeek Harness uses the microphone only after you approve a voice-input or recording request.
    NSCameraUsageDescription: DeepSeek Harness uses the camera only after you approve a camera request.
    NSLocationWhenInUseUsageDescription: DeepSeek Harness uses your location only after you approve a location request.
  icon: build/icon.icns
  # Open-source release baseline: keep Apple Silicon code structurally signed
  # without binding artifacts to a short-lived development certificate.
  identity: "-"
  hardenedRuntime: false
  timestamp: none
  target:
    - dmg
    - zip
  artifactName: DeepSeek-Harness-macos-${arch}.${ext}
