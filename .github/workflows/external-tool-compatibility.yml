name: External tool compatibility

on:
  push:
    branches: [master]
    paths:
      - apps/desktop/external-tools/manifests/**
      - apps/desktop/scripts/verify-external-tool-compatibility.ts
      - apps/desktop/scripts/external-tool-provider-compatibility.ts
      - apps/desktop/src/external-tool-compatibility-manifest.ts
      - apps/desktop/src/external-tool-compatibility.ts
      - packages/subagent/subagent-codex/package.json
      - packages/subagent/subagent-claude-code/package.json
      - packages/client/ui-settings-plugin-inventory/src/client/external-tool-compatibility-bridge.ts
      - .github/workflows/external-tool-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'flaqai/open-deepseek-harness-desktop' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify exact providers and platform runtimes
        run: pnpm run verify:desktop:external-tools

      - name: Prepare compatibility manifest
        run: |
          mkdir -p .artifacts/external-tool-pages/metadata/external-tools/v2
          for manifest in apps/desktop/external-tools/manifests/*/external-tools-compatibility.v2.json; do
            version="$(basename "$(dirname "$manifest")")"
            subject="external-tools-compatibility-${version}.v2.json"
            cp "$manifest" "$subject"
            cp "$manifest" ".artifacts/external-tool-pages/metadata/external-tools/v2/$subject"
          done

      - name: Refuse immutable manifest replacement
        run: |
          for subject in external-tools-compatibility-*.v2.json; do
            remote="$(mktemp)"
            status="$(curl --silent --show-error --location --output "$remote" --write-out '%{http_code}' "https://flaqai.github.io/open-deepseek-harness-desktop/metadata/external-tools/v2/$subject")"
            if [ "$status" = 200 ]; then
              cmp --silent "$subject" "$remote" || { echo "Published immutable manifest differs: $subject" >&2; exit 1; }
            elif [ "$status" != 404 ]; then
              echo "Could not verify immutable manifest $subject: HTTP $status" >&2
              exit 1
            fi
            rm -f "$remote"
          done

      - id: attest
        name: Sign compatibility manifest with GitHub OIDC
        uses: actions/attest@v4
        with:
          subject-path: external-tools-compatibility-*.v2.json

      - name: Prepare static metadata site
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" .artifacts/external-tool-pages/metadata/external-tools/v2/external-tools-compatibility.v2.sigstore.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload signed metadata site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/external-tool-pages

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
