# Build each desktop artifact on the operating system and CPU architecture it ships for.
name: Desktop packages

on:
  push:
    tags:
      - 'dsh-v*'
  workflow_dispatch:
    inputs:
      target:
        description: Package target
        required: true
        type: choice
        default: all
        options:
          - all
          - windows-x64
      publish:
        description: Create or update the GitHub Release; requires a dsh-v* tag
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24.11.1'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    if: ${{ github.event_name == 'push' || inputs.target == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build macOS package
        run: pnpm run package:desktop:macos:${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            .artifacts/desktop-macos/DeepSeek-Harness-macos-${{ matrix.arch }}.dmg
            .artifacts/desktop-macos/DeepSeek-Harness-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows-x64' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm run package:desktop:win:x64

      - name: Smoke test installed Windows package
        shell: pwsh
        run: apps/desktop/scripts/smoke-windows-package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: .artifacts/desktop-windows/DeepSeek-Harness-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64
    if: ${{ github.event_name == 'push' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install package tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq rpm

      - run: pnpm install --frozen-lockfile

      - name: Build Linux packages
        run: pnpm run package:desktop:linux:x64

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: |
            .artifacts/desktop-linux/DeepSeek-Harness-linux-x64.deb
            .artifacts/desktop-linux/DeepSeek-Harness-linux-x64.rpm
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: SHA-256 checksums
    needs: [macos, windows, linux]
    if: ${{ always() && needs.windows.result == 'success' && (inputs.target == 'windows-x64' || (needs.macos.result == 'success' && needs.linux.result == 'success')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum DeepSeek-Harness-* > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [macos, windows, linux, checksums]
    if: ${{ always() && needs.checksums.result == 'success' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Verify release tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/dsh-v*) ;;
            *) echo "::error::Desktop publication requires a dsh-v* tag"; exit 1 ;;
          esac

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#dsh-v}"
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" --title "DeepSeek Harness Desktop $version" --generate-notes "${prerelease[@]}" dist/*
          fi
