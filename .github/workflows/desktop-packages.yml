# Build each desktop artifact on the operating system and CPU architecture it ships for.
name: Desktop packages
run-name: Desktop packages ${{ inputs.target }} ${{ inputs.orchestration_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package target
        required: true
        type: choice
        default: all
        options:
          - all
          - macos
          - windows-x64
          - linux-x64
      refresh_plugins:
        description: Resolve latest stable bundled plugins (disable for a packaging-only rebuild)
        required: true
        type: boolean
        default: true
      bundled_plugin_run_id:
        description: Reuse a same-commit plugin snapshot; Windows candidate requalification may use its originating run
        required: false
        type: string
        default: ''
      orchestration_id:
        description: Stable local orchestration key used to recover an already dispatched run
        required: false
        type: string
        default: ''
      windows_candidate_run_id:
        description: Requalify a Windows candidate from this completed run (content and installer hashes must match)
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24.17.0'
  DSH_TELEMETRY_DISABLED: '1'
  PNPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NO_PROXY: 127.0.0.1,localhost,::1

jobs:
  bundled-plugins:
    name: Prepare bundled plugins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify package resource contract
        run: node --test apps/desktop/scripts/packaged-resource-contract.test.mjs

      - name: Verify external tool provider coordinates
        run: pnpm run verify:desktop:external-tools

      - name: Verify embedded Node runtime pins
        run: node --test apps/desktop/scripts/node-runtime-pins.test.mjs

      - name: Verify desktop runtime file selection
        run: >-
          node --test
          apps/desktop/scripts/runtime-file-policy.test.mjs
          apps/desktop/scripts/workspace-runtime-packaging.test.mjs
          apps/desktop/scripts/desktop-packaging-workflow.test.mjs
          apps/desktop/scripts/report-package-sizes.test.mjs

      - name: Verify reused bundled plugin snapshot commit
        if: ${{ inputs.bundled_plugin_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot_sha="$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.bundled_plugin_run_id }}" --jq .head_sha)"
          if [ "$snapshot_sha" != "${{ github.sha }}" ] && ! {
            [ "${{ inputs.target }}" = windows-x64 ] &&
            [ -n "${{ inputs.windows_candidate_run_id }}" ] &&
            [ "${{ inputs.bundled_plugin_run_id }}" = "${{ inputs.windows_candidate_run_id }}" ];
          }; then
            echo "Bundled plugin snapshot run ${{ inputs.bundled_plugin_run_id }} belongs to $snapshot_sha, expected ${{ github.sha }}" >&2
            exit 1
          fi

      - name: Clear checked-in bundled plugin snapshot
        if: ${{ inputs.bundled_plugin_run_id != '' }}
        run: >-
          node -e "require('node:fs').rmSync('apps/desktop/bundled-plugins', { recursive: true, force: true })"

      - uses: actions/download-artifact@v4
        if: ${{ inputs.bundled_plugin_run_id != '' }}
        with:
          name: bundled-plugin-snapshot
          path: apps/desktop/bundled-plugins
          run-id: ${{ inputs.bundled_plugin_run_id }}
          github-token: ${{ github.token }}

      - name: Resolve latest stable plugin archives
        if: ${{ inputs.bundled_plugin_run_id == '' && inputs.refresh_plugins }}
        run: pnpm run refresh:desktop:bundled-plugins

      - name: Verify bundled plugin snapshot before handoff
        run: pnpm run verify:desktop:bundled-plugin-snapshot

      - uses: actions/upload-artifact@v4
        with:
          name: bundled-plugin-snapshot
          path: apps/desktop/bundled-plugins
          if-no-files-found: error
          retention-days: 14
          compression-level: '0'

  windows-preflight:
    name: Windows x64 fast preflight
    if: ${{ inputs.target == 'all' || inputs.target == 'windows-x64' }}
    runs-on: windows-2025
    steps:
      - name: Reject candidate reuse outside Windows-only qualification
        if: ${{ inputs.windows_candidate_run_id != '' && inputs.target != 'windows-x64' }}
        run: exit 1

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify Windows packaging and candidate contracts
        run: >-
          node --test
          apps/desktop/scripts/runtime-deploy-config.test.mjs
          apps/desktop/scripts/collect-windows-smoke-evidence.test.mjs
          apps/desktop/scripts/windows-package-candidate.test.mjs

      - name: Verify Windows runner protocol
        run: pnpm exec vitest run packages/subprocess/subprocess-local/tests/spawn-runner.spec.ts packages/subprocess/subprocess-local/tests/windows-job.spec.ts

      - name: Verify first-start candidate lifecycle
        run: >-
          pnpm exec vitest run
          apps/desktop/tests/candidate-welcome-gate.spec.ts
          apps/desktop/tests/first-start-preparation.spec.ts
          apps/desktop/tests/recovery-candidate.spec.ts

  macos:
    name: macOS ${{ matrix.arch }}
    if: ${{ inputs.windows_candidate_run_id == '' && (inputs.target == 'all' || inputs.target == 'macos') }}
    needs: bundled-plugins
    env:
      DSH_BUNDLED_PLUGINS_REFRESH: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Use resolved bundled plugin snapshot
        run: |
          node -e "require('node:fs').rmSync('apps/desktop/bundled-plugins', { recursive: true, force: true })"

      - uses: actions/download-artifact@v4
        with:
          name: bundled-plugin-snapshot
          path: apps/desktop/bundled-plugins

      - name: Verify resolved bundled plugin snapshot
        run: pnpm run verify:desktop:bundled-plugin-snapshot

      - name: Build macOS Host, Client and Desktop
        run: pnpm run build:community-desktop

      - name: Prepare macOS Python and Office resources
        run: pnpm exec tsx apps/desktop/scripts/prepare-workspace-runtime.ts mac-${{ matrix.arch }}

      - name: Prepare macOS Harness runtime and preset Profile
        run: |
          ulimit -n 65536
          echo "macOS packaging open-file limit: $(ulimit -n)"
          node apps/desktop/scripts/prepare-unix-runtime.mjs --target darwin-${{ matrix.arch }}

      - name: Build macOS DMG and ZIP
        run: |
          ulimit -n 65536
          CSC_IDENTITY_AUTO_DISCOVERY=false node apps/desktop/node_modules/electron-builder/out/cli/cli.js --projectDir apps/desktop --config electron-builder.macos.yml --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Verify macOS Helper lookup regression
        run: node --test apps/desktop/scripts/smoke-macos-package.test.mjs

      - name: Smoke final macOS DMG and ZIP
        run: >-
          node apps/desktop/scripts/smoke-macos-package.mjs
          .artifacts/desktop-macos/DeepSeek-Harness-macos-${{ matrix.arch }}.dmg
          .artifacts/desktop-macos/DeepSeek-Harness-macos-${{ matrix.arch }}.zip

      - name: Record qualified macOS installer sizes
        run: >-
          node apps/desktop/scripts/report-package-sizes.mjs
          .artifacts/desktop-macos/DeepSeek-Harness-macos-${{ matrix.arch }}.dmg
          .artifacts/desktop-macos/DeepSeek-Harness-macos-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            .artifacts/desktop-macos/DeepSeek-Harness-macos-${{ matrix.arch }}.dmg
            .artifacts/desktop-macos/DeepSeek-Harness-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: '0'

  windows:
    name: Build Windows x64 candidate
    if: ${{ inputs.windows_candidate_run_id == '' && (inputs.target == 'all' || inputs.target == 'windows-x64') }}
    needs: [bundled-plugins, windows-preflight]
    env:
      DSH_BUNDLED_PLUGINS_REFRESH: '0'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Use resolved bundled plugin snapshot
        run: |
          node -e "require('node:fs').rmSync('apps/desktop/bundled-plugins', { recursive: true, force: true })"

      - uses: actions/download-artifact@v4
        with:
          name: bundled-plugin-snapshot
          path: apps/desktop/bundled-plugins

      - name: Prepare bundled plugins
        run: pnpm run verify:desktop:bundled-plugin-snapshot

      - name: Build clean-checkout Host and Desktop
        run: pnpm run build:community-desktop

      - name: Prepare bundled Python runtime and Office metadata
        run: pnpm exec tsx apps/desktop/scripts/prepare-workspace-runtime.ts win-x64

      - name: Deploy Windows runtime
        run: node apps/desktop/scripts/prepare-windows-runtime.mjs

      - name: Build Windows installer
        working-directory: apps/desktop
        run: node node_modules/electron-builder/out/cli/cli.js --win nsis --x64 --publish never

      - name: Probe unpacked app.asar and Electron entries
        run: node apps/desktop/scripts/smoke-windows-unpacked.mjs

      - name: Record Windows candidate identity
        run: >-
          node apps/desktop/scripts/windows-package-candidate.mjs create .
          .artifacts/desktop-windows/DeepSeek-Harness-windows-x64.exe
          apps/desktop/bundled-plugins
          .artifacts/desktop-windows/windows-package-candidate.json

      - name: Preserve Windows candidate
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qualification-windows-x64-candidate
          path: |
            .artifacts/desktop-windows/DeepSeek-Harness-windows-x64.exe
            .artifacts/desktop-windows/windows-package-candidate.json
          if-no-files-found: warn
          retention-days: 3

  windows-smoke:
    name: Smoke Windows x64 candidate
    needs: [bundled-plugins, windows-preflight, windows]
    if: >-
      ${{ always() && needs.bundled-plugins.result == 'success' && needs.windows-preflight.result == 'success' && (inputs.target == 'all' || inputs.target == 'windows-x64') && (
        (inputs.windows_candidate_run_id == '' && needs.windows.result == 'success') ||
        inputs.windows_candidate_run_id != ''
      ) }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.windows_candidate_run_id != '' && '0' || '1' }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Verify Windows smoke evidence interface
        shell: pwsh
        run: |
          & apps/desktop/scripts/windows-smoke-journal.test.ps1
          node --test apps/desktop/scripts/collect-windows-smoke-evidence.test.mjs

      - uses: actions/download-artifact@v4
        with:
          name: bundled-plugin-snapshot
          path: .artifacts/bundled-plugin-snapshot

      - uses: actions/download-artifact@v4
        with:
          name: qualification-windows-x64-candidate
          path: .artifacts/desktop-windows
          run-id: ${{ inputs.windows_candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify Windows candidate identity
        run: >-
          node apps/desktop/scripts/windows-package-candidate.mjs verify .
          .artifacts/desktop-windows/DeepSeek-Harness-windows-x64.exe
          .artifacts/bundled-plugin-snapshot
          .artifacts/desktop-windows/windows-package-candidate.json

      - name: Smoke test installed Windows package
        shell: pwsh
        run: apps/desktop/scripts/smoke-windows-package.ps1

      - name: Collect Windows smoke evidence
        if: ${{ always() }}
        continue-on-error: true
        run: node apps/desktop/scripts/collect-windows-smoke-evidence.mjs

      - name: Preserve Windows smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qualification-windows-x64-evidence
          path: .artifacts/windows-smoke-evidence
          if-no-files-found: warn
          retention-days: 3

      - name: Record qualified Windows installer size
        run: >-
          node apps/desktop/scripts/report-package-sizes.mjs
          .artifacts/desktop-windows/DeepSeek-Harness-windows-x64.exe

      - name: Publish qualified Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            .artifacts/desktop-windows/DeepSeek-Harness-windows-x64.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: '0'

  linux:
    name: Linux x64
    if: ${{ inputs.windows_candidate_run_id == '' && (inputs.target == 'all' || inputs.target == 'linux-x64') }}
    needs: bundled-plugins
    env:
      DSH_BUNDLED_PLUGINS_REFRESH: '0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install package tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq rpm

      - run: pnpm install --frozen-lockfile

      - name: Use resolved bundled plugin snapshot
        run: |
          node -e "require('node:fs').rmSync('apps/desktop/bundled-plugins', { recursive: true, force: true })"

      - uses: actions/download-artifact@v4
        with:
          name: bundled-plugin-snapshot
          path: apps/desktop/bundled-plugins

      - name: Verify resolved bundled plugin snapshot
        run: pnpm run verify:desktop:bundled-plugin-snapshot

      - name: Build Linux Host, Client and Desktop
        run: pnpm run build:community-desktop

      - name: Prepare Linux Python and Office resources
        run: pnpm exec tsx apps/desktop/scripts/prepare-workspace-runtime.ts linux-x64

      - name: Prepare Linux Harness runtime and preset Profile
        run: node apps/desktop/scripts/prepare-unix-runtime.mjs --target linux-x64

      - name: Build Linux installers
        run: node apps/desktop/node_modules/electron-builder/out/cli/cli.js --projectDir apps/desktop --config electron-builder.linux.yml --linux deb rpm --x64 --publish never

      - name: Verify packaged preset resources
        run: node apps/desktop/scripts/verify-prebuilt-profile.mjs .artifacts/desktop-linux/linux-unpacked/resources

      - name: Record qualified Linux installer sizes
        run: >-
          node apps/desktop/scripts/report-package-sizes.mjs
          .artifacts/desktop-linux/DeepSeek-Harness-linux-x64.deb
          .artifacts/desktop-linux/DeepSeek-Harness-linux-x64.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: |
            .artifacts/desktop-linux/DeepSeek-Harness-linux-x64.deb
            .artifacts/desktop-linux/DeepSeek-Harness-linux-x64.rpm
          if-no-files-found: error
          retention-days: 14
          compression-level: '0'

  checksums:
    name: SHA-256 checksums
    needs: [macos, windows-smoke, linux]
    if: >-
      ${{ always() && (
        (inputs.target == 'all' && needs.macos.result == 'success' && needs.windows-smoke.result == 'success' && needs.linux.result == 'success') ||
        (inputs.target == 'macos' && needs.macos.result == 'success') ||
        (inputs.target == 'windows-x64' && needs.windows-smoke.result == 'success') ||
        (inputs.target == 'linux-x64' && needs.linux.result == 'success')
      ) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: >-
          find . -maxdepth 1 -type f
          \( -name 'DeepSeek-Harness-macos-*' -o -name 'DeepSeek-Harness-windows-*' -o -name 'DeepSeek-Harness-linux-*' \)
          -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
